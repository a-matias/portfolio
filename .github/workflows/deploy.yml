name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # O la rama que estés usando para desarrollo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'  # O la versión de Node.js que estás usando

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build  # O el comando adecuado para tu proyecto

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist  # Cambia a la carpeta que contiene los archivos de producción
