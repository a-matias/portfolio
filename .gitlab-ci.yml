image: node:lts

stages:
  - build
  - deploy

cache:
  key: $CI_COMMIT_REF_SLUG
  paths:
    - node_modules/
  policy: push

before_script:
  # Instala dependencias del proyecto y las nuevas librerías
  - npm install
  - npm install sweetalert2  # Instala SweetAlert2
  - npm install --save @emailjs/browser

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - public  # Especificamos la carpeta que GitLab Pages debe usar para el despliegue
      - dist

pages:
  stage: deploy
  script:
    - mv dist public
  artifacts:
    paths:
      - public
  only:
    - main  # Esto asegura que solo la rama principal (main) se desplegará en GitLab Pages
