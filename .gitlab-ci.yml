image: node:lts

stages:
  - build
  - deploy

before_script:
  - npm install

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist  # Guarda la carpeta `dist` generada por el build

pages:
  stage: deploy
  script:
    - mv dist public  # Mueve los archivos generados a la carpeta `public`, necesaria para GitLab Pages
  artifacts:
    paths:
      - public
  only:
    - main  # O la rama que elijas para desplegar
