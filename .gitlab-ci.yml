image: node:lts

stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/  # Cachea dependencias para acelerar futuros pipelines

before_script:
  - npm ci  # Instala dependencias (más confiable que npm install)

build:
  stage: build
  script:
    - echo "Limpiando carpetas previas..."
    - rm -rf dist public  # Elimina dist y public si existen
    - echo "Construyendo el proyecto..."
    - npm run build  # Construye el proyecto
    - echo "Preparando archivos para despliegue..."
    - mkdir -p public  # Crea la carpeta public
    - cp -r dist/* public/  # Copia el contenido de dist a public
    - ls -l public  # Verifica el contenido de la carpeta public
  artifacts:
    paths:
      - public  # Guarda la carpeta public como artefacto
    expire_in: 1 week  # Los artefactos estarán disponibles por una semana
  only:
    - main  # Corre el job solo en la rama main

deploy:
  stage: deploy
  script:
    - echo "Archivos listos para el despliegue."
  artifacts:
    paths:
      - public  # Usa los archivos generados en public para desplegar
  only:
    - main
