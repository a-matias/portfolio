image: node:lts

stages:
  - build
  - deploy

cache:
  key: $CI_COMMIT_REF_SLUG
  paths:
    - node_modules/
  policy: push

before_script:
  # Instala dependencias del proyecto y las nuevas librerías
  - npm install
  - npm install sweetalert2 emailjs-com --save  # Instala SweetAlert2 y EmailJS

build:
  stage: build
  script:
    - npm run build  # Compila el proyecto de Vue
  artifacts:
    paths:
      - dist  # Guardamos solo la carpeta dist para el despliegue

pages:
  stage: deploy
  script:
    - mv dist public  # GitLab Pages requiere una carpeta llamada "public"
  artifacts:
    paths:
      - public  # La carpeta que GitLab Pages usará para el despliegue
  only:
    - main  # Solo se ejecuta en la rama principal (main)
