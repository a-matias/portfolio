image: node:lts

stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/  # Cachear dependencias para acelerar futuros pipelines

before_script:
  - npm ci  # Instala dependencias (más confiable que npm install)

build:
  stage: build
  script:
    - npm run build
    - ls -l dist  # Verifica contenido
    - rm -rf public
    - mkdir -p public
    - cp -r dist/* public/

  artifacts:
    paths:
      - public
  only:
    - main  # Corre el job solo en la rama main

pages:
  stage: deploy
  script:
    - echo "Archivos listos para GitLab Pages"
  artifacts:
    paths:
      - public
  only:
    - main
