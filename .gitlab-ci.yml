image: node:lts

stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/  # Cachear dependencias para acelerar futuros pipelines

before_script:
  - npm ci  # Instala dependencias (más confiable que npm install)

build:
  stage: build
  script:
    - npm run build  # Construye el proyecto
    - rm -rf public  # Limpia cualquier despliegue previo
    - mkdir -p public
    - cp -r dist/* public/  # Copia los archivos generados a la carpeta public
    - ls -la public  # Verifica los archivos en la carpeta public
  artifacts:
    paths:
      - public
  only:
    - main  # Corre el job solo en la rama main

pages:
  stage: deploy
  script:
    - echo "Archivos listos para GitLab Pages"
  artifacts:
    paths:
      - public
  only:
    - main
