image: node:lts

stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/  # Cachear node_modules para acelerar futuras ejecuciones

before_script:
  - npm install

build:
  stage: build
  script:
    - npm run build
    - rm -rf public  # Limpia cualquier contenido previo
    - mkdir -p public
    - cp -r dist/* public/  # Copia explícitamente todos los archivos
  artifacts:
    paths:
      - public
  only:
    - main

pages:
  stage: deploy
  script:
    - echo "Despliegue completado"
  artifacts:
    paths:
      - public  # La carpeta que se usará para el hosting
  only:
    - main
